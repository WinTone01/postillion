# Coolify için Docker Compose kaynağı.
#
# Coolify'da: Yeni Kaynak → Docker Compose, deponuzu seçin, "Compose dosyası"
# olarak `docker-compose.yaml` verin. Domains alanında her servise ayrı alan
# adı veriliyor: panel `postillion.net`, sunucu `sync.postillion.net`.
#
# Panel ve sunucu AYNI dosyada çünkü aynı veritabanını paylaşıyorlar. Ayrı
# Coolify kaynakları olsalardı ayrı ağlarda olurlardı ve panelin `db` adını
# çözmesi mümkün olmazdı — bağlantı bilgilerini elle girmek gerekirdi ve
# hangisinin eksik olduğu ancak yığın izinden anlaşılırdı.
#
# Dosya depo KÖKÜNDE duruyor ve yollar köke göre yazılı. Coolify proje
# dizinini depo kökü yapıyor ve `build.context`'i compose dosyasının
# bulunduğu yere değil ona göre çözüyor; `deploy/` altında `context: ..`
# yazan bir sürüm bu yüzden `<depo>/../deploy` arayıp düşüyordu. Kökte
# durunca iki yorumlayıcı da aynı yeri gösteriyor.
#
# TLS'i ve alan adını Coolify'ın vekili yönetiyor — WebSocket yükseltmesi
# dahil. Bu yüzden burada nginx yok.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postillion
      POSTGRES_USER: postillion
      # Coolify `SERVICE_PASSWORD_` ile başlayan değişkenleri kendisi üretip
      # panelde gösteriyor; parolayı bu dosyaya yazmıyoruz.
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postillion-db:/var/lib/postgresql/data
    # `ports` YOK: veritabanı yalnızca compose ağından erişilebilir olmalı,
    # internete açılmamalı.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postillion -d postillion"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Coolify bu değişkeni görünce servise bir alan adı atıyor ve 8787'e
      # vekillik ediyor.
      - SERVICE_FQDN_SERVER_8787
      - DATABASE_URL=postgres://postillion:${SERVICE_PASSWORD_POSTGRES}@db:5432/postillion
      # Cihazlarınızın kullanacağı jeton. Coolify üretiyor; değerini
      # panelden okuyup istemcilere girin.
      - POSTILLION_SERVER_TOKEN=${SERVICE_PASSWORD_POSTILLIONTOKEN}
      - RUST_LOG=postillion_server=info,tower_http=warn
    depends_on:
      db:
        # Şema ilk açılışta kuruluyor; veritabanı hazır olmadan başlarsa
        # sunucu hemen düşerdi.
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      # İkili kendi kendini yokluyor; çalışma imajında kabuk da `curl` de yok.
      test: ["CMD", "/usr/local/bin/postillion-server", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  panel:
    # Tanıtım sayfası da bunun içinde: `/` statik sayfa, `/app` panel.
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_PANEL_3333
      - TZ=UTC
      - NODE_ENV=production
      - LOG_LEVEL=info
      - SESSION_DRIVER=cookie
      # Oturum çerezlerini imzalıyor. Değişirse herkes çıkış yapmış olur.
      - APP_KEY=${SERVICE_PASSWORD_PANELKEY}
      # Sunucuyla AYNI veritabanı: panel kayıt satırlarını ve jeton tablosunu
      # oradan okuyor. Aynı compose'da olduğu için `db` adı burada çözülüyor.
      - DATABASE_URL=postgres://postillion:${SERVICE_PASSWORD_POSTGRES}@db:5432/postillion
      # Canlılık ve transkript sunucudan geliyor. `server` adı da aynı ağda.
      - POSTILLION_SERVER_URL=http://server:8787
      - POSTILLION_SERVER_TOKEN=${SERVICE_PASSWORD_POSTILLIONTOKEN}
      # Boş bırakılırsa captcha ATLANIYOR — üretimde doldurun.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  postillion-db:
