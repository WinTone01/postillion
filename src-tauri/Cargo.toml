[package]
name = "postillion"
version = "0.1.0"
description = "Switch Claude accounts without losing the conversation"
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri mobil hedefleri için cdylib, masaüstü binary'si için rlib.
name = "postillion_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2.1.0-beta.7"


[dev-dependencies]
# Entegrasyon testleri crate'in normal bağımlılıklarını göremez.
dirs = "6"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
# Boyut değil hız: bu ikili 400 MB transcript ayrıştırıyor ve `/proc` tarıyor.
# `opt-level = "s"` ile tarama ölçülebilir biçimde yavaştı.
opt-level = 3
strip = true
