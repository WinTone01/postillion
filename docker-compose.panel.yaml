# Coolify için panel kaynağı — tanıtım sayfası da bunun içinde.
#
# Coolify'da: Yeni Kaynak → Docker Compose, compose dosyası olarak
# `docker-compose.panel.yaml`, Domains alanına `postillion.net`.
#
# Veritabanı eşitleme sunucusuyla AYNI olmalı: panel kayıt satırlarını ve
# jeton tablosunu oradan okuyor.

services:
  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_PANEL_3333
      - TZ=UTC
      - NODE_ENV=production
      # Oturum çerezlerini imzalıyor. Değişirse herkes çıkış yapmış olur.
      - APP_KEY=${SERVICE_PASSWORD_PANELKEY}
      - LOG_LEVEL=info
      - SESSION_DRIVER=cookie
      # Eşitleme sunucusunun veritabanı.
      - DB_HOST=${PANEL_DB_HOST}
      - DB_PORT=${PANEL_DB_PORT:-5432}
      - DB_USER=${PANEL_DB_USER}
      - DB_PASSWORD=${PANEL_DB_PASSWORD}
      - DB_DATABASE=${PANEL_DB_DATABASE}
      # Canlılık ve transkript buradan geliyor.
      - POSTILLION_SERVER_URL=${POSTILLION_SERVER_URL}
      - POSTILLION_SERVER_TOKEN=${POSTILLION_SERVER_TOKEN}
      # Boş bırakılırsa captcha ATLANIYOR — üretimde doldurun.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET}
    expose:
      - "3333"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
