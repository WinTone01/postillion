server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statik site: bulunmayan yol 404 vermeli. SPA'lardaki gibi her isteği
    # index.html'e düşürmek, kırık bağlantıları sessizce ana sayfa gibi
    # gösterip yanlış bağlantıların fark edilmesini engellerdi.
    location / {
        try_files $uri $uri/ =404;
    }

    # Varlıklar içerik değişmeden aynı adla kalıyor, uzun önbellek güvenli.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html önbelleğe ALINMAMALI: yeni dağıtımdan sonra tarayıcı eski
    # sayfayı gösterirse yeni varlıklara hiç ulaşamaz.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Sayfa hiçbir yere gömülmüyor ve tür tahmini istemiyoruz.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
