<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Postillion — one conversation, any account">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4623F"/>
      <stop offset="100%" stop-color="#9E4A2E"/>
    </linearGradient>
  </defs>

  <rect width="960" height="260" rx="24" fill="url(#bg)"/>

  <!-- Maskot: uygulama ikonunun aynısı, ölçeklenmiş. -->
  <g transform="translate(72 62) scale(6.4)" fill="#FDF6F2">
    <rect x="5.5"  y="1.4"  width="9"   height="2.6" rx="0.3"/>
    <rect x="3.5"  y="3.8"  width="13"  height="1.2" rx="0.3"/>
    <rect x="5.5"  y="5.2"  width="9"   height="6.6" rx="0.6"/>
    <rect x="6.3"  y="12.4" width="7.4" height="4.6" rx="0.5"/>
    <rect x="4.3"  y="12.6" width="1.8" height="3.6" rx="0.45"/>
    <rect x="13.9" y="12.6" width="1.8" height="3.6" rx="0.45"/>
    <rect x="6.5"  y="17.3" width="2.6" height="1.7" rx="0.4"/>
    <rect x="10.9" y="17.3" width="2.6" height="1.7" rx="0.4"/>
  </g>
  <g transform="translate(72 62) scale(6.4)" fill="#C4623F">
    <rect x="7.4"  y="7.6" width="1.7" height="2.4" rx="0.35"/>
    <rect x="10.9" y="7.6" width="1.7" height="2.4" rx="0.35"/>
  </g>

  <text x="248" y="122" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="62" font-weight="650" letter-spacing="-1.6" fill="#FFF8F4">Postillion</text>
  <text x="252" y="164" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="23" fill="#F6D9CB">One conversation, any account.</text>

  <!-- Hesap değişimi: aynı iplik, değişen taşıyıcı. -->
  <g transform="translate(252 196)">
    <rect x="0"   y="0" width="86" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="43"  y="18" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="13" fill="#FFF1E9">account A</text>

    <path d="M96 13 h34" stroke="#F6D9CB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M124 8 l7 5 -7 5" fill="none" stroke="#F6D9CB" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="140" y="0" width="150" height="26" rx="13" fill="#FFF8F4"/>
    <text x="215" y="18" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="13" fill="#8F3F26">same transcript</text>

    <path d="M300 13 h34" stroke="#F6D9CB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
    <path d="M328 8 l7 5 -7 5" fill="none" stroke="#F6D9CB" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="344" y="0" width="86" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="387" y="18" text-anchor="middle" font-family="ui-monospace, monospace"
          font-size="13" fill="#FFF1E9">account B</text>
  </g>
</svg>
