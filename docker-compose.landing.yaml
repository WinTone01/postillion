# Coolify için landing sayfası kaynağı.
#
# Coolify'da: Yeni Kaynak → Docker Compose, bu depoyu seçin, compose dosyası
# olarak `docker-compose.landing.yaml` verin, ardından Domains alanına kendi
# alan adınızı yazın. TLS'i Coolify'ın vekili sonlandırıyor.
#
# Dosya depo KÖKÜNDE: Coolify proje dizinini depo kökü yapıyor ve derleme
# bağlamını ona göre çözüyor, dolayısıyla `apps/landing/` altındaki bir
# compose'un `context: .`'i kökü işaret edip kökte Dockerfile arıyordu.
#
# Eşitleme sunucusundan AYRI bir kaynak: sayfayı güncellemek sunucuyu
# yeniden başlatmamalı.

services:
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    restart: unless-stopped
    environment:
      # Coolify bu değişkeni görünce servise alan adı atayıp 80'e vekillik
      # ediyor.
      - SERVICE_FQDN_LANDING_80
    expose:
      - "80"
