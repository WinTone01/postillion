# Ters vekil — /etc/nginx/sites-available/postillion
#
# TLS'i certbot yönetiyor:
#   sudo certbot --nginx -d sunucu.alanadiniz.com

server {
    listen 443 ssl http2;
    server_name sunucu.alanadiniz.com;

    # certbot bu satırları kendisi dolduruyor.
    # ssl_certificate     /etc/letsencrypt/live/sunucu.alanadiniz.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sunucu.alanadiniz.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSocket yükseltmesi: bu iki başlık olmadan bağlantı düz HTTP
        # olarak kalıyor ve eşitleme hiç kurulmuyor.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sohbet soketi uzun süre sessiz kalabiliyor; varsayılan 60 sn onu
        # düzenli aralıklarla koparır ve istemciyi sürekli yeniden bağlanmaya
        # zorlardı.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Anlık görüntü indirmesi Range ile devam ediyor; ara bellekleme
        # kısmi cevabı bozardı.
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name sunucu.alanadiniz.com;
    return 301 https://$host$request_uri;
}
